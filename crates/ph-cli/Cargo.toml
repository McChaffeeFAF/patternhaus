[package]
name = "ph-cli"
description = "patternhaus-cli: run commands, scripts, renders and analysis from a shell, and serve MCP (headless or attached to a running app)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "patternhaus-cli"
path = "src/main.rs"

[dependencies]
ph-commands.workspace = true
ph-control.workspace = true
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
serde_json.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "io-std", "time"] }

[dev-dependencies]
png = "0.18"
rmcp = { version = "3.5", default-features = false, features = ["client", "transport-child-process", "transport-async-rw"] }
serde_json.workspace = true
tempfile.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "io-std", "time", "process"] }
