[package]
name = "ph-engine"
description = "Patternhaus audio engine: render plans, graph scheduling, real-time and offline rendering."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
ph-core.workspace = true
ph-node.workspace = true
thiserror.workspace = true
ph-dsp.workspace = true
ph-stretch.workspace = true
ph-instruments.workspace = true
ph-effects.workspace = true
ph-formats.workspace = true
ph-plugin-host.workspace = true
cpal.workspace = true
rtrb.workspace = true
hound.workspace = true
serde.workspace = true
serde_json.workspace = true
midir.workspace = true
assert_no_alloc.workspace = true

[features]
# Steinberg ASIO host (GPLv3 build, DESIGN §11). Off by default.
asio = ["cpal/asio"]

[dev-dependencies]
criterion.workspace = true
tempfile.workspace = true

[[bench]]
name = "reference"
harness = false

# Model-checked atomics for the lock-free pieces: `RUSTFLAGS="--cfg loom" cargo test -p
# ph-engine --lib --release loom` (see `src/loom_models.rs`).
[target.'cfg(loom)'.dependencies]
loom = "0.7"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(loom)"] }
