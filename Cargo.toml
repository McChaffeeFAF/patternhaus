[workspace]
resolver = "3"
members = ["crates/*", "tools/*", "test-plugins/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/McChaffeeFAF/patternhaus"
rust-version = "1.90"

[workspace.dependencies]
ph-core = { path = "crates/ph-core", version = "0.1.0" }
ph-node = { path = "crates/ph-node", version = "0.1.0" }
ph-commands = { path = "crates/ph-commands", version = "0.1.0" }
ph-engine = { path = "crates/ph-engine", version = "0.1.0" }
ph-dsp = { path = "crates/ph-dsp", version = "0.1.0" }
ph-instruments = { path = "crates/ph-instruments", version = "0.1.0" }
ph-effects = { path = "crates/ph-effects", version = "0.1.0" }
ph-formats = { path = "crates/ph-formats", version = "0.1.0" }
ph-control = { path = "crates/ph-control", version = "0.1.0" }
ph-ui = { path = "crates/ph-ui", version = "0.1.0" }
ph-cli = { path = "crates/ph-cli", version = "0.1.0" }
ph-analysis = { path = "crates/ph-analysis", version = "0.1.0" }
ph-plugin-host = { path = "crates/ph-plugin-host", version = "0.1.0" }
ph-stretch = { path = "crates/ph-stretch", version = "0.1.0" }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
schemars = "1"
thiserror = "2"
midly = "0.5"
proptest = "1"
tempfile = "3"
symphonia = { version = "0.5", default-features = false, features = ["wav", "aiff", "flac", "mp3", "ogg", "vorbis", "pcm"] }
assert_no_alloc = "1.1"
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }
cpal = "0.18"
rtrb = "0.4"
# MIDI input (M2/T8; MIT)
midir = "0.11"
hound = "3.5"
flacenc = { version = "0.5", default-features = false }
egui = { version = "0.36", default-features = false }
eframe = { version = "0.36", default-features = false, features = ["wgpu", "wayland", "x11"] }
egui_kittest = { version = "0.36", features = ["wgpu", "snapshot"] }
toml = "1"
ron = "0.12"
# window handles for plugin editors (already in the tree through winit/wgpu)
raw-window-handle = "0.6"
# plugin hosting (M2/T3; licences in docs/formats/m2-dependencies.md)
clack-host = "0.2"
clack-extensions = { version = "0.2", features = ["clack-host", "audio-ports", "note-ports", "params", "state", "latency", "tail", "gui", "log", "thread-check", "raw-window-handle_06"] }
clap-sys = "0.5"
vst3 = "0.3"
libloading = "0.8"
cc = "1"

[profile.dev]
# DSP is unusably slow unoptimised; keep debug info but optimise a little, and dependencies fully.
opt-level = 1
[profile.dev.package."*"]
opt-level = 3

[profile.release]
debug = "line-tables-only"
