[workspace]
resolver = "3"
members = ["crates/*", "tools/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/McChaffeeFAF/patternhaus"
rust-version = "1.90"

[workspace.dependencies]
ph-core = { path = "crates/ph-core" }
ph-node = { path = "crates/ph-node" }
ph-commands = { path = "crates/ph-commands" }
ph-engine = { path = "crates/ph-engine" }
ph-dsp = { path = "crates/ph-dsp" }
ph-instruments = { path = "crates/ph-instruments" }
ph-effects = { path = "crates/ph-effects" }
ph-formats = { path = "crates/ph-formats" }
ph-control = { path = "crates/ph-control" }
ph-ui = { path = "crates/ph-ui" }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
schemars = "1"
thiserror = "2"
midly = "0.5"
proptest = "1"
tempfile = "3"
symphonia = { version = "0.5", default-features = false, features = ["wav", "aiff", "flac", "mp3", "ogg", "vorbis", "pcm"] }
assert_no_alloc = "1.1"
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }
cpal = "0.18"
rtrb = "0.4"
hound = "3.5"
flacenc = { version = "0.5", default-features = false }
egui = "0.36"
eframe = { version = "0.36", default-features = false, features = ["wgpu", "default_fonts", "wayland", "x11"] }
egui_dock = { version = "0.21", features = ["serde"] }
egui_kittest = { version = "0.36", features = ["wgpu", "snapshot"] }
toml = "1"

[profile.dev]
# DSP is unusably slow unoptimised; keep debug info but optimise a little, and dependencies fully.
opt-level = 1
[profile.dev.package."*"]
opt-level = 3

[profile.release]
debug = "line-tables-only"
