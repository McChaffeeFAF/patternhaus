# Rolling "nightly" pre-release: every push to main builds Windows, Linux and macOS zips and
# replaces the assets of the GitHub release tagged `nightly` (the tag moves to the new commit).
name: nightly

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: nightly
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  label:
    runs-on: ubuntu-latest
    outputs:
      label: ${{ steps.l.outputs.label }}
    steps:
      - id: l
        run: echo "label=nightly-$(date -u +%Y%m%d)-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

  build:
    needs: label
    uses: ./.github/workflows/build-dist.yml
    with:
      label: ${{ needs.label.outputs.label }}

  publish:
    needs: [label, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: move the nightly tag to this commit
        run: |
          git tag -f nightly "$GITHUB_SHA"
          git push -f origin refs/tags/nightly
      - name: replace the nightly pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete nightly --yes --cleanup-tag=false 2>/dev/null || true
          gh release create nightly dist/*.zip \
            --prerelease \
            --title "Nightly (${{ needs.label.outputs.label }})" \
            --notes "Automatic build of main at ${GITHUB_SHA}. Pre-alpha: expect breakage. Each zip holds ph-app, patternhaus-cli, the factory assets, THIRD_PARTY_NOTICES.md, the licences and a README. See CHANGELOG.md."
