# Rolling "nightly" pre-release. Runs only after the CI workflow has finished *successfully* on
# main, and builds exactly the commit CI tested, so a red main never publishes. It builds Windows,
# Linux and macOS zips and replaces the assets of the GitHub release tagged `nightly` (the tag moves
# to that commit). Can also be started by hand (workflow_dispatch) for the current main.
name: nightly

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: nightly
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  label:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    outputs:
      label: ${{ steps.l.outputs.label }}
      sha: ${{ steps.l.outputs.sha }}
    steps:
      - id: l
        env:
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "label=nightly-$(date -u +%Y%m%d)-${SHA::7}" >> "$GITHUB_OUTPUT"

  build:
    needs: label
    uses: ./.github/workflows/build-dist.yml
    with:
      label: ${{ needs.label.outputs.label }}
      ref: ${{ needs.label.outputs.sha }}

  publish:
    needs: [label, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.label.outputs.sha }}
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: move the nightly tag to the tested commit
        env:
          SHA: ${{ needs.label.outputs.sha }}
        run: |
          git tag -f nightly "$SHA"
          git push -f origin refs/tags/nightly
      - name: replace the nightly pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.label.outputs.sha }}
        run: |
          gh release delete nightly --yes --cleanup-tag=false 2>/dev/null || true
          gh release create nightly dist/*.zip \
            --prerelease \
            --title "Nightly (${{ needs.label.outputs.label }})" \
            --notes "Automatic build of main at ${SHA}, published after CI passed. Pre-alpha: expect breakage. Each zip holds ph-app, patternhaus-cli, the factory assets, THIRD_PARTY_NOTICES.md, the licences and a README. See CHANGELOG.md."
